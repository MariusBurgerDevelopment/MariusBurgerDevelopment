<svg width="100%" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e080a" />
      <stop offset="50%" stop-color="#14080b" />
      <stop offset="100%" stop-color="#1c0a0e" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#871523" />
      <stop offset="60%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#ff4d6d" />
    </linearGradient>
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff1744" flood-opacity="0.25" />
    </filter>
    <radialGradient id="radarSweep" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Main Card Container -->
  <rect x="0.5" y="0.5" width="849" height="239" rx="14" fill="url(#matrixBg)" stroke="#ef4444" stroke-opacity="0.75" filter="url(#matrixGlow)" />

  <!-- Corner Tech Brackets -->
  <path d="M 2 20 L 2 2 L 20 2 M 848 20 L 848 2 L 830 2 M 2 220 L 2 238 L 20 238 M 848 220 L 848 238 L 830 238" stroke="#ff1744" stroke-width="2" />

  <!-- Status Pill Header -->
  <g transform="translate(35, 26)">
    <rect x="0" y="0" width="195" height="22" rx="4" fill="#200d11" stroke="#ff1744" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#ff1744">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="15" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">TELEMETRY // DISCIPLINES</text>
  </g>
  <text x="245" y="41" fill="#71717a" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.5">CORE CAPABILITY MATRIX v4.2</text>

  <!-- Progress Bars -->
  
    <!-- Bar 1: SPATIAL & 3D COMPUTING -->
    <g transform="translate(35, 72)">
      <!-- Title & Tech -->
      <text x="0" y="0" fill="#f4f4f5" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.5">SPATIAL &amp; 3D COMPUTING</text>
      <text x="210" y="0" fill="#71717a" font-family="monospace" font-size="10" font-weight="500">[Three.js · WebGL · GLSL · R3F]</text>
      <text x="448" y="13" fill="#ff1744" font-family="monospace" font-size="12" font-weight="800" text-anchor="start">96%</text>
      
      <!-- Track -->
      <rect x="0" y="6" width="430" height="8" rx="4" fill="#181416" stroke="#331c22" stroke-width="1" />
      
      <!-- Fill -->
      <rect x="0" y="6" width="412" height="8" rx="4" fill="url(#barGrad)" />
      
      <!-- Laser Runner -->
      <g>
        <rect x="0" y="6" width="28" height="8" rx="4" fill="#ffffff" opacity="0.85">
          <animate attributeName="x" values="0;382;0" dur="3.2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
    <!-- Bar 2: FULL-STACK ARCHITECTURE -->
    <g transform="translate(35, 112)">
      <!-- Title & Tech -->
      <text x="0" y="0" fill="#f4f4f5" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.5">FULL-STACK ARCHITECTURE</text>
      <text x="210" y="0" fill="#71717a" font-family="monospace" font-size="10" font-weight="500">[Next.js · Node.js · TypeScript · Supabase]</text>
      <text x="448" y="13" fill="#ff1744" font-family="monospace" font-size="12" font-weight="800" text-anchor="start">94%</text>
      
      <!-- Track -->
      <rect x="0" y="6" width="430" height="8" rx="4" fill="#181416" stroke="#331c22" stroke-width="1" />
      
      <!-- Fill -->
      <rect x="0" y="6" width="404" height="8" rx="4" fill="url(#barGrad)" />
      
      <!-- Laser Runner -->
      <g>
        <rect x="0" y="6" width="28" height="8" rx="4" fill="#ffffff" opacity="0.85">
          <animate attributeName="x" values="0;374;0" dur="2.8s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
    <!-- Bar 3: AUTONOMOUS AGENTS & BOTS -->
    <g transform="translate(35, 152)">
      <!-- Title & Tech -->
      <text x="0" y="0" fill="#f4f4f5" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.5">AUTONOMOUS AGENTS &amp; BOTS</text>
      <text x="210" y="0" fill="#71717a" font-family="monospace" font-size="10" font-weight="500">[Python · Automation · Multi-Agent Systems]</text>
      <text x="448" y="13" fill="#ff1744" font-family="monospace" font-size="12" font-weight="800" text-anchor="start">92%</text>
      
      <!-- Track -->
      <rect x="0" y="6" width="430" height="8" rx="4" fill="#181416" stroke="#331c22" stroke-width="1" />
      
      <!-- Fill -->
      <rect x="0" y="6" width="395" height="8" rx="4" fill="url(#barGrad)" />
      
      <!-- Laser Runner -->
      <g>
        <rect x="0" y="6" width="28" height="8" rx="4" fill="#ffffff" opacity="0.85">
          <animate attributeName="x" values="0;365;0" dur="3.6s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
    <!-- Bar 4: GRAPHICS PIPELINE & ASSETS -->
    <g transform="translate(35, 192)">
      <!-- Title & Tech -->
      <text x="0" y="0" fill="#f4f4f5" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.5">GRAPHICS PIPELINE &amp; ASSETS</text>
      <text x="210" y="0" fill="#71717a" font-family="monospace" font-size="10" font-weight="500">[Blender · Procedural Shaders · Realtime Assets]</text>
      <text x="448" y="13" fill="#ff1744" font-family="monospace" font-size="12" font-weight="800" text-anchor="start">88%</text>
      
      <!-- Track -->
      <rect x="0" y="6" width="430" height="8" rx="4" fill="#181416" stroke="#331c22" stroke-width="1" />
      
      <!-- Fill -->
      <rect x="0" y="6" width="378" height="8" rx="4" fill="url(#barGrad)" />
      
      <!-- Laser Runner -->
      <g>
        <rect x="0" y="6" width="28" height="8" rx="4" fill="#ffffff" opacity="0.85">
          <animate attributeName="x" values="0;348;0" dur="3.0s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

  <!-- Right Section: Cybernetic Radar & Reticle -->
  <g transform="translate(710, 110)">
    <!-- Outer dashed reticle ring -->
    <circle cx="0" cy="0" r="66" stroke="#ff1744" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4" />
    
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="46" stroke="#ff1744" stroke-opacity="0.4" stroke-width="1" />
    
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="24" stroke="#ff1744" stroke-opacity="0.6" stroke-width="1" />
    
    <!-- Reticle Crosshairs -->
    <line x1="-74" y1="0" x2="74" y2="0" stroke="#ff1744" stroke-opacity="0.35" stroke-width="1" />
    <line x1="0" y1="-74" x2="0" y2="74" stroke="#ff1744" stroke-opacity="0.35" stroke-width="1" />
    
    <!-- Center Core -->
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    
    <!-- Rotating Radar Sweep Beam -->
    <g>
      <path d="M 0 0 L 0 -66 A 66 66 0 0 1 52 -40 Z" fill="url(#radarSweep)" opacity="0.6" />
      <line x1="0" y1="0" x2="0" y2="-66" stroke="#ff1744" stroke-width="1.5" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </g>

    <!-- Radar Target Blips -->
    <circle cx="28" cy="-24" r="3.5" fill="#ff1744">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" begin="-0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="-32" cy="18" r="3" fill="#ff4d6d">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" begin="-1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Avionics Telemetry Coordinates -->
  <g transform="translate(710, 202)" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1">
    <text x="0" y="0" fill="#a1a1aa">LOC: <tspan fill="#ff1744">33.92°S 18.42°E</tspan></text>
    <text x="0" y="14" fill="#71717a">RADAR: <tspan fill="#10b981">SWEEP ACTIVE</tspan> [ZA]</text>
  </g>
</svg>